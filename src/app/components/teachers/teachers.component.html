<div class="page-header">

  <h2>Teachers</h2>

  <p-button
    label="Add Teacher"
    icon="pi pi-user-plus"
    styleClass="add-btn"
    (click)="openAddTeacherDialog()"
  ></p-button>

</div>

<p-table
  [value]="teachers"
  [loading]="loading"
  [paginator]="true"
  [rows]="6"
  responsiveLayout="scroll"
  styleClass="teacher-table"
>

  <!-- HEADER -->
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Full Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>Role</th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <!-- BODY -->
  <ng-template pTemplate="body" let-teacher>

    <tr>

      <td>{{ teacher.id }}</td>

      <td>
        {{ teacher.firstName }}
        {{ teacher.lastName }}
      </td>

      <td>{{ teacher.email }}</td>

      <td>{{ teacher.age }}</td>

      <td>
        <p-tag
          value="Teacher"
          severity="success"
        ></p-tag>
      </td>

      <!-- ACTIONS -->
      <td class="actions">

        <!-- EDIT -->
        <button
          pButton
          type="button"
          icon="pi pi-pencil"
          class="
            p-button-rounded
            p-button-text
            p-button-success
          "
          pTooltip="Edit Teacher"
          (click)="editTeacher(teacher)"
        ></button>

        <!-- DELETE -->
        <button
          pButton
          type="button"
          icon="pi pi-trash"
          class="
            p-button-rounded
            p-button-text
            p-button-danger
          "
          pTooltip="Delete Teacher"
          (click)="deleteTeacher(teacher, $event)"
        ></button>

      </td>

    </tr>

  </ng-template>

</p-table>

<!-- =========================
     DYNAMIC DIALOG
========================= -->
<app-dialog-form

  [(visible)]="showTeacherDialog"

  type="teacher"

  (save)="addTeacher($event)"

>
</app-dialog-form>
