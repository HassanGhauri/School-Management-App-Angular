<div class="page-header">

  <h2>Teachers</h2>

  <p-button
    label="Add Teacher"
    icon="pi pi-user-plus"
    styleClass="add-btn"
  ></p-button>

</div>

<p-table
  [value]="teachers"
  [loading]="loading"
  [paginator]="true"
  [rows]="6"
  responsiveLayout="scroll"
  styleClass="teacher-table"
>

  <!-- TABLE HEADER -->
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Full Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>Role</th>
    </tr>
  </ng-template>

  <!-- TABLE BODY -->
  <ng-template pTemplate="body" let-teacher>
    <tr>

      <td>{{ teacher.id }}</td>

      <td>
        {{ teacher.firstName }}
        {{ teacher.lastName }}
      </td>

      <td>{{ teacher.email }}</td>

      <td>{{ teacher.age }}</td>

      <td>
        <p-tag
          value="Teacher"
          severity="success"
        ></p-tag>
      </td>

    </tr>
  </ng-template>

</p-table>
