<div class="page-header">

  <h2>Students</h2>

  <p-button
    label="Add Student"
    icon="pi pi-user-plus"
    styleClass="add-btn"
  ></p-button>

</div>

<p-table
  [value]="students"
  [loading]="loading"
  [paginator]="true"
  [rows]="5"
  responsiveLayout="scroll"
  styleClass="student-table"
>

  <!-- HEADER -->
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>Role</th>
    </tr>
  </ng-template>

  <!-- BODY -->
  <ng-template pTemplate="body" let-student>
    <tr>
      <td>{{ student.id }}</td>
      <td>{{ student.firstName }} {{ student.lastName }}</td>
      <td>{{ student.email }}</td>
      <td>{{ student.age }}</td>
      <td>
        <span class="role-badge">{{ student.role }}</span>
      </td>
    </tr>
  </ng-template>

</p-table>
