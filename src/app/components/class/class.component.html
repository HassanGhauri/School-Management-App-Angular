<div *ngIf="classData" class="class-page">

  <!-- HEADER CARD -->
  <p-card styleClass="header-card">

    <h2>{{ classData.className }}</h2>

    <p>
      <i class="pi pi-user"></i>
      <b>Class Teacher:</b>
      {{ classData.classTeacherName || 'Not Assigned' }}
    </p>

  </p-card>

  <!-- GRID -->
  <div class="grid">

    <!-- STUDENTS -->
    <p-card header="Students" styleClass="section-card">

      <p-table [value]="classData.students" responsiveLayout="scroll">

        <ng-template pTemplate="header">
          <tr>
            <th>ID</th>
            <th>Full Name</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-student>
          <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.fullName }}</td>
          </tr>
        </ng-template>

      </p-table>

    </p-card>

    <!-- TEACHERS -->
    <p-card header="Assigned Teachers" styleClass="section-card">

      <ul>
        <li *ngFor="let t of classData.assignedTeachers">
          <i class="pi pi-user"></i>
          {{ t.fullName }}
        </li>
      </ul>

    </p-card>

    <!-- SUBJECTS -->
    <p-card header="Subjects" styleClass="section-card">

      <div class="tags">
        <span class="tag" *ngFor="let s of classData.subjects">
          {{ s }}
        </span>
      </div>

    </p-card>

  </div>

</div>
