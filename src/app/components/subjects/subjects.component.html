<div class="page-header">

  <h2>Subjects</h2>

  <p-button label="Add Subject" icon="pi pi-book" styleClass="add-btn" (click)="openCreateDialog()"></p-button>

</div>

<p-table [value]="subjects" [loading]="loading" [paginator]="true" [rows]="6" responsiveLayout="scroll"
  styleClass="subject-table">

  <!-- HEADER -->
  <ng-template pTemplate="header">

    <tr>

      <th>ID</th>

      <th>Subject Name</th>

      <th>Status</th>

      <th>Actions</th>

    </tr>

  </ng-template>

  <!-- BODY -->
  <ng-template pTemplate="body" let-subject>

    <tr>

      <td>
        {{ subject.id }}
      </td>

      <td>

        <div class="subject-name">

          <i class="pi pi-book"></i>

          {{ subject.name }}

        </div>

      </td>

      <td>

        <p-tag value="Active" severity="success"></p-tag>

      </td>

      <!-- ACTIONS -->
      <td>

        <div class="actions">

          <!-- EDIT -->
          <button pButton type="button" icon="pi pi-pencil" class="p-button-rounded
                   p-button-text
                   p-button-success" pTooltip="Edit Subject" (click)="editSubject(subject)"></button>

          <!-- DELETE -->
          <button pButton type="button" icon="pi pi-trash" class="p-button-rounded
                   p-button-text
                   p-button-danger" pTooltip="Delete Subject" (click)="deleteSubject(subject)"></button>

        </div>

      </td>

    </tr>

  </ng-template>

</p-table>

<!-- =========================
     DIALOG
========================= -->
<app-dialog-form [(visible)]="showDialog" type="subject" [editMode]="editMode" [data]="selectedSubject"
  (save)="saveSubject($event)">
</app-dialog-form>
